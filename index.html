    <!-- ============ 타이포 ============ -->
    <div class="wordmark anim" style="--d:.55s">
      <h1 class="wordmark__main"><span data-txt="wordmarkLine1"></span><span data-txt="wordmarkLine2"></span></h1>
      <p class="wordmark__sub" data-txt="wordmarkSub"></p>
      <i class="wordmark__rule"></i>
    </div>

    <p class="cap cap--1 anim" style="--d:.95s"><span data-txt="cap1"></span></p>

    <p class="cap cap--2 anim" style="--d:1.05s"><span data-txt="cap2"></span></p>

    <p class="cap cap--3 anim" style="--d:1.15s"><span data-txt="cap3"></span></p>

    <span class="vtext vtext--left anim" style="--d:1.1s" data-txt="verticalLeft"></span>

    <span class="bignum anim" style="--d:1.25s" data-txt="bigNumber"></span>

    <div class="lead anim" style="--d:1.35s">
      <p class="lead__main"><span data-txt="lead"></span></p>
      <p class="lead__sub" data-txt="sub"></p>
    </div>

    <i class="cstage"></i>
    <p class="subtitle" data-txt="subtitle"></p>
    <button class="enter-hint" id="enter" type="button" data-txt="enterLabel"></button>
    <span class="cornermark anim" style="--d:1.5s" data-txt="cornermark"></span>

    <!-- ============ 위 / 아래 노란 띠 ============ -->
    <div class="band band--top">
      <span data-txt="topLeft"></span>
      <span data-txt="topRight"></span>
    </div>

    <div class="band band--bottom">
      <span class="band__credit" data-txt="credit"></span>
      <span class="marquee"><span class="marquee__inner" id="marquee"></span></span>
      <button class="replay" id="replay" type="button">REPLAY &#9654;</button>
    </div>
