<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WUTHERING HEIGHTS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%239ABADB'/%3E%3Crect x='6' y='6' width='20' height='20' fill='%231E282C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Holtwood+One+SC&amp;family=Rock+Salt&amp;family=Playfair+Display:ital,wght@1,500;1,700&amp;family=Noto+Sans+JP:wght@200;400;900&amp;family=Noto+Sans+KR:wght@300;500;700;900&amp;family=Roboto+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<!-- is-playing : 위·아래 띠가 미끄러져 들어옵니다
     curtains-open : 앞 페이지에서 닫힌 커튼이 열립니다
     page-three : 스크립트가 이 페이지를 알아보게 하는 표시 -->
<body class="is-playing curtains-open page-three">
  <audio id="bgmAudio" src="audio/after-the-wuthering.mp3" loop preload="auto"></audio>
  <script src="js/bgm.js?v=2" async></script>

<div class="viewport">
  <div class="stage" id="stage">

    <!-- ============ 종이 콜라주 ============
         1400x600 상자 안에 px 로 배치합니다. 창 크기와 상관없이
         구도가 그대로 유지되도록 상자째 가운데에 둡니다.
         글자는 전부 content.js 의 p3... 에서 고칩니다 -->
    <div class="p3">

      <!-- 가운데 큰 제목 + 그 아래 대문자 한 줄 -->
      <!-- 포스터 제목 = 손글씨 로고. 크기는 css .p3logo 의 width 로 -->
      <img class="p3logo" src="images/wordmark-art.webp" alt="Wuthering Heights">

      <!-- 왼쪽 도장 -->
      <div class="p3stamp">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <path id="p3ring" fill="none"
                  d="M100,100 m-74,0 a74,74 0 1,1 148,0 a74,74 0 1,1 -148,0"/>
          </defs>
          <circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <text class="p3stamp__ring"><textPath href="#p3ring" startOffset="0"
                data-txt="p3StampRing"></textPath></text>
          <text class="p3stamp__num" x="100" y="86"  data-txt="p3StampTop"></text>
          <line x1="68" y1="100" x2="132" y2="100" stroke="currentColor" stroke-width="1.2"/>
          <text class="p3stamp__num" x="100" y="134" data-txt="p3StampBot"></text>
        </svg>
      </div>

      <!-- 도장 아래 리본 -->
      <div class="p3ribbon"><span data-txt="p3Ribbon"></span></div>

      <!-- 가운데 찢어진 티켓 -->
      <div class="p3ticket">
        <div class="p3ticket__paper">
          <div class="p3ticket__holes"></div>
          <div class="p3ticket__side"><span data-txt="p3Side"></span></div>
          <div class="p3ticket__body">
            <div class="p3row p3row--date">
              <span class="p3row__label" data-txt="p3DateLabel"></span>
              <span class="p3row__date"  data-txt="p3DateValue"></span>
              <span class="p3row__suf"   data-txt="p3DateSuf"></span>
            </div>
            <div class="p3row p3row--split">
              <span class="p3row__label" data-txt="p3RowLabel1"></span>
              <span class="p3row__value" data-txt="p3RowValue1"></span>
              <span class="p3row__label p3row__label--2" data-txt="p3RowLabel2"></span>
              <span class="p3row__value" data-txt="p3RowValue2"></span>
            </div>
            <div class="p3row p3row--foot">
              <span data-txt="p3Foot"></span>
            </div>
          </div>
        </div>
      </div>
      <svg class="p3clip p3clip--ticket" viewBox="0 0 40 92" aria-hidden="true"><path d="M9 72 L9 24 A11 11 0 0 1 31 24 L31 76 A9 9 0 0 1 13 76 L13 34" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>

      <!-- 오른쪽 전신 그림 -->
      <img class="p3art" src="images/p3-pair.webp" alt="" draggable="false">

      <!-- 티켓 위에 붙인 하트 두 장 -->
      <img class="p3heart p3heart--1" src="images/p3-heart-1.webp" alt="" draggable="false">
      <img class="p3heart p3heart--2" src="images/p3-heart-2.webp" alt="" draggable="false">

      <!-- 오른쪽 클립 꽂힌 쪽지 -->
      <div class="p3note">
        <div class="p3note__paper">
          <span class="p3note__label" data-txt="p3NoteLabel"></span>
          <span class="p3note__en1"   data-txt="p3NoteEn1"></span>
          <p    class="p3note__en2"   data-txt="p3NoteEn2"></p>
          <p    class="p3note__ko"    data-txt="p3NoteKo"></p>
          <span class="p3note__foot"  data-txt="p3NoteFoot"></span>
        </div>
      </div>
      <svg class="p3clip p3clip--note" viewBox="0 0 40 92" aria-hidden="true"><path d="M9 72 L9 24 A11 11 0 0 1 31 24 L31 76 A9 9 0 0 1 13 76 L13 34" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>

    </div>

    <!-- 다음 장(후기)으로 -->
    <a class="p3next" id="p3next" href="page4.html">NEXT ▸</a>

    <!-- 아래 띠 위의 체크무늬 -->
    <div class="p3check"></div>

    <!-- ============ 위·아래 띠 ============ -->
    <div class="band band--top">
      <span data-txt="topLeft"></span>
      <!-- 배경 음악 조작부 -->
      <div class="bgm" id="bgm">
        <button class="bgm__btn bgm__play" id="bgmPlay" type="button"
                aria-label="재생 / 정지"></button>
        <span class="bgm__eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <input class="bgm__bar" id="bgmBar" type="range" min="0" max="1000" value="0"
                aria-label="재생 위치">
        <span class="bgm__time" id="bgmTime">0:00 / 0:00</span>
        <button class="bgm__btn bgm__mute" id="bgmMute" type="button"
                aria-label="음소거"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 6.1h2.4L8.1 3.3v9.4L4.8 9.9H2.4z" fill="currentColor" stroke-width="1.2"/><g class="bgm__wave"><path d="M10.5 6.1a2.7 2.7 0 0 1 0 3.8"/><path d="M12.4 4.3a5.2 5.2 0 0 1 0 7.4"/></g><g class="bgm__x"><path d="M10.7 6.1l3.6 3.8"/><path d="M14.3 6.1l-3.6 3.8"/></g></svg></button>
        <input class="bgm__vol" id="bgmVol" type="range" min="0" max="100" value="55"
                aria-label="볼륨">
      </div>
      <span data-txt="topRight"></span>
    </div>

    <div class="band band--bottom">
      <span class="band__credit" data-txt="credit"></span>
      <span class="band__credit" data-txt="p3Credit"></span>
      <span class="band__credit" data-txt="logoCredit"></span>
      <span class="band__credit" data-txt="musicCredit"></span>
      <span class="marquee"><span class="marquee__inner" id="marquee"></span></span>
      <a class="replay" href="page2.html" data-txt="backLabel"></a>
    </div>

  </div>

  <i class="curtain curtain--top"></i>
  <i class="curtain curtain--bottom"></i>
</div>

<script src="content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
